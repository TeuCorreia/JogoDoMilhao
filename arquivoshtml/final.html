<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Resultado Final</title>
    <link rel="stylesheet" href="../arquivoscss/final.css" />
    <link rel="stylesheet" href="../arquivoscss/jogar.css" />
  </head>

  <body>
    <audio
      id="somVitoria"
      src="../sons/silvio-santos-parabens-ganhar-1-milhao-de-reais.mp3"
    ></audio>

    <div class="box">
      <h1>🏆 Resultado Final</h1>
      <p id="mensagem"></p>

      <br />

      <div class="alternativas">
        <div class="alternativa" onclick="voltarInicio()">
          Voltar para a tela inicial
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
      function soltarConfete() {
        confetti({
          particleCount: 150,
          spread: 100,
          origin: { y: 0.6 },
        });
      }

      const som = document.getElementById("somVitoria");

      window.onload = () => {
        let pontuacao = localStorage.getItem("pontuacao") || 0;
        let acertos = localStorage.getItem("acertos") || 0;
        let erros = localStorage.getItem("erros") || 0;

        let mensagem = document.getElementById("mensagem");

        mensagem.innerHTML = `
          💰 Pontuação final: <strong>${pontuacao}</strong><br><br>
          ✅ Acertos: <strong>${acertos}</strong><br>
          ❌ Erros: <strong>${erros}</strong>
        `;

        if (pontuacao == 1000000) {
          mensagem.innerHTML += "<br><br>🔥 VOCÊ ZEROU O JOGO! 🔥";
        } else if (acertos > erros) {
          mensagem.innerHTML += "<br><br>👏 Mandou bem!";
        } else {
          mensagem.innerHTML += "<br><br>😅 Dá pra melhorar!";
        }

        soltarConfete();

        som.play().catch(() => {
          console.log("Autoplay bloqueado 😢");
        });
      };

      function voltarInicio() {
        som.play();
        window.location.href = "../index.html";
      }
    </script>
  </body>
</html>
